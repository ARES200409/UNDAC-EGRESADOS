name: NEXO UNDAC - Calidad automatizada
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Verificar sintaxis Python
        run: python -m compileall -q app
      - name: Ejecutar pruebas unitarias sin MySQL real
        env:
          SECRET_KEY: clave-local-de-ci-no-usar-en-produccion
          NEXO_SOLO_SISTEMAS: 'true'
        run: python -m pytest -q tests
